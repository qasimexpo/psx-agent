<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">How a Shariah-compliant pick is produced on SmartSarmaya</title>
  <desc id="d">Six steps from the exchange's KMI All Shares Islamic Index list to a recorded, tracked pick. The AI ranks and explains only after the exchange has decided which stocks are Shariah compliant.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:14}
      .exchange{fill:#ecfdf5;stroke:#10b981}
      .ai{fill:#eef2ff;stroke:#6366f1}
      .h{font:700 17px 'DM Sans',system-ui,sans-serif;fill:#0b132b}
      .s{font:400 13.5px 'DM Sans',system-ui,sans-serif;fill:#475569}
      .tag{font:700 11px 'DM Sans',system-ui,sans-serif;letter-spacing:.08em;fill:#047857}
      .tagai{fill:#4338ca}
      .n{font:700 13px 'DM Sans',system-ui,sans-serif;fill:#ffffff}
    </style>
  </defs>
  <rect width="1200" height="420" fill="#f6f8fb"/>

  <!-- row 1 -->
  <g transform="translate(40,40)">
    <rect class="box exchange" width="340" height="140" rx="14"/>
    <circle cx="28" cy="28" r="14" fill="#10b981"/><text class="n" x="28" y="33" text-anchor="middle">1</text>
    <text class="tag" x="54" y="33">PAKISTAN STOCK EXCHANGE</text>
    <text class="h" x="20" y="68">KMI All Shares Islamic Index</text>
    <text class="s" x="20" y="92">The exchange publishes which listed</text>
    <text class="s" x="20" y="112">companies pass its Shariah screens.</text>
    <text class="s" x="20" y="132">This is the only source of Shariah status.</text>
  </g>
  <g transform="translate(430,40)">
    <rect class="box" width="340" height="140" rx="14"/>
    <circle cx="28" cy="28" r="14" fill="#0b132b"/><text class="n" x="28" y="33" text-anchor="middle">2</text>
    <text class="tag" x="54" y="33" fill="#475569">FILTER</text>
    <text class="h" x="20" y="68">Candidates cut to constituents</text>
    <text class="s" x="20" y="92">Anything not in the index is removed</text>
    <text class="s" x="20" y="112">before the model sees a single name.</text>
    <text class="s" x="20" y="132">Conventional banks never get this far.</text>
  </g>
  <g transform="translate(820,40)">
    <rect class="box" width="340" height="140" rx="14"/>
    <circle cx="28" cy="28" r="14" fill="#0b132b"/><text class="n" x="28" y="33" text-anchor="middle">3</text>
    <text class="tag" x="54" y="33" fill="#475569">REAL NUMBERS</text>
    <text class="h" x="20" y="68">Prices and technicals attached</text>
    <text class="s" x="20" y="92">Latest price, RSI, moving averages and</text>
    <text class="s" x="20" y="112">52-week position, computed in code from</text>
    <text class="s" x="20" y="132">exchange closing prices.</text>
  </g>

  <!-- row 2 (right to left) -->
  <g transform="translate(820,240)">
    <rect class="box ai" width="340" height="140" rx="14"/>
    <circle cx="28" cy="28" r="14" fill="#6366f1"/><text class="n" x="28" y="33" text-anchor="middle">4</text>
    <text class="tag tagai" x="54" y="33">AI MODEL</text>
    <text class="h" x="20" y="68">Ranks and explains</text>
    <text class="s" x="20" y="92">Chooses among the screened list and</text>
    <text class="s" x="20" y="112">writes the reasoning. It is never asked</text>
    <text class="s" x="20" y="132">whether a company is Shariah compliant.</text>
  </g>
  <g transform="translate(430,240)">
    <rect class="box" width="340" height="140" rx="14"/>
    <circle cx="28" cy="28" r="14" fill="#0b132b"/><text class="n" x="28" y="33" text-anchor="middle">5</text>
    <text class="tag" x="54" y="33" fill="#475569">GUARD</text>
    <text class="h" x="20" y="68">Invented tickers discarded</text>
    <text class="s" x="20" y="92">Any symbol the model returns that was</text>
    <text class="s" x="20" y="112">not in the supplied list is dropped.</text>
    <text class="s" x="20" y="132">Prices come from the database, not the model.</text>
  </g>
  <g transform="translate(40,240)">
    <rect class="box exchange" width="340" height="140" rx="14"/>
    <circle cx="28" cy="28" r="14" fill="#10b981"/><text class="n" x="28" y="33" text-anchor="middle">6</text>
    <text class="tag" x="54" y="33">TRACK RECORD</text>
    <text class="h" x="20" y="68">Recorded and marked to market</text>
    <text class="s" x="20" y="92">Every pick is saved with its date and</text>
    <text class="s" x="20" y="112">price, then tracked publicly, winners</text>
    <text class="s" x="20" y="132">and losers alike.</text>
  </g>

  <!-- arrows -->
  <path d="M380,110 L428,110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M770,110 L818,110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M990,182 L990,238" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M818,310 L772,310" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M428,310 L382,310" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
