<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Timeline of a PSX dividend: announcement, ex-date, book closure, payment</title>
  <desc id="d">Buy before the ex-date to receive the dividend. From the ex-date the ticker carries an XD suffix until book closure ends. Payment follows within the period the company announces.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b132b"/>
    </marker>
    <style>
      .h{font:700 16px 'DM Sans',system-ui,sans-serif;fill:#0b132b}
      .s{font:400 13px 'DM Sans',system-ui,sans-serif;fill:#475569}
      .k{font:700 11px 'DM Sans',system-ui,sans-serif;letter-spacing:.08em;fill:#64748b}
      .big{font:700 13px 'DM Sans',system-ui,sans-serif;fill:#ffffff}
    </style>
  </defs>
  <rect width="1200" height="360" fill="#f6f8fb"/>

  <!-- line -->
  <path d="M80,200 L1120,200" stroke="#0b132b" stroke-width="3" marker-end="url(#arr)"/>

  <!-- shaded XD period -->
  <rect x="560" y="170" width="300" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="k" x="710" y="163" text-anchor="middle" fill="#b45309">TICKER SHOWS "XD" (e.g. BOPXD)</text>

  <!-- points -->
  <g transform="translate(160,200)">
    <circle r="12" fill="#0b132b"/><text class="big" y="5" text-anchor="middle">1</text>
    <text class="h" y="-40" text-anchor="middle">Announcement</text>
    <text class="s" y="50" text-anchor="middle">Board declares e.g. "60% final</text>
    <text class="s" y="68" text-anchor="middle">dividend" = Rs 6 per Rs 10 share.</text>
    <text class="s" y="86" text-anchor="middle">Book closure dates are set.</text>
  </g>
  <g transform="translate(410,200)">
    <circle r="12" fill="#10b981"/><text class="big" y="5" text-anchor="middle">2</text>
    <text class="h" y="-40" text-anchor="middle">Last day to buy</text>
    <text class="s" y="50" text-anchor="middle">Own the shares by the close of</text>
    <text class="s" y="68" text-anchor="middle">the day before the ex-date, so</text>
    <text class="s" y="86" text-anchor="middle">settlement lands before closure.</text>
  </g>
  <g transform="translate(560,200)">
    <circle r="12" fill="#f59e0b"/><text class="big" y="5" text-anchor="middle">3</text>
    <text class="h" y="-40" text-anchor="middle">Ex-date</text>
    <text class="s" y="50" text-anchor="middle">Price usually drops by about</text>
    <text class="s" y="68" text-anchor="middle">the dividend. Buyers from here</text>
    <text class="s" y="86" text-anchor="middle">do not receive it.</text>
  </g>
  <g transform="translate(860,200)">
    <circle r="12" fill="#f59e0b"/><text class="big" y="5" text-anchor="middle">4</text>
    <text class="h" y="-40" text-anchor="middle">Book closure ends</text>
    <text class="s" y="50" text-anchor="middle">Register of holders is fixed.</text>
    <text class="s" y="68" text-anchor="middle">Suffix drops, ticker returns</text>
    <text class="s" y="86" text-anchor="middle">to its plain symbol.</text>
  </g>
  <g transform="translate(1060,200)">
    <circle r="12" fill="#0b132b"/><text class="big" y="5" text-anchor="middle">5</text>
    <text class="h" y="-40" text-anchor="middle">Payment</text>
    <text class="s" y="50" text-anchor="middle">Credited to your bank or</text>
    <text class="s" y="68" text-anchor="middle">CDC account, net of</text>
    <text class="s" y="86" text-anchor="middle">withholding tax.</text>
  </g>

  <text class="s" x="80" y="330" fill="#64748b">XB marks an ex-bonus (free shares) period and XR an ex-rights period in the same way. Exact dates are in each company's PSX announcement.</text>
</svg>
